name: Deploy Website to DreamHost

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    # ─────────────────────────────────────────────────────────────────────
    # MAINTENANCE — le build de l'application est désactivé le temps de
    # l'intervention. À la place du site, on ne publie que maintenance/ :
    # la page d'indisponibilité et son .htaccess (qui renvoie 503 sur tout
    # le répertoire, y compris les fichiers restés d'un déploiement
    # précédent). Le code source de l'application est intact dans le dépôt ;
    # pour rétablir le site, revenir sur ce commit (git revert) et supprimer
    # /new-prasmesti/.htaccess sur le serveur.
    # ─────────────────────────────────────────────────────────────────────
    - name: 🚧 Publier la page d'indisponibilité à la place du site
      run: |
        rm -rf new-prasmesti
        mkdir new-prasmesti
        cp -r maintenance/. new-prasmesti/
        # Le .htaccess sert cette copie comme ErrorDocument : c'est le seul
        # fichier du répertoire qu'il laisse passer, d'où le nom distinct.
        cp maintenance/index.html new-prasmesti/indisponible.html
        ls -la new-prasmesti

    - name: 🚀 SFTP Deploy
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        remote_path: /home/dh_33tuig/aleoss2.dreamhosters.com/
        sftp_only: true
