<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Accès indisponible</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --fond: #f4f5f7;
      --carte: #ffffff;
      --texte: #1f2937;
      --texte-doux: #5b6472;
      --trait: #e3e6ea;
      --accent: #1b3a6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fond);
      color: var(--texte);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--carte);
      border: 1px solid var(--trait);
      border-radius: 12px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 28px rgba(16, 24, 40, .06);
    }
    .marque {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--texte-doux);
      border: 1px solid var(--trait);
      border-radius: 999px;
      padding: 5px 12px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 600;
      color: var(--accent);
    }
    p {
      margin: 0 0 14px;
      color: var(--texte-doux);
      font-size: 16px;
    }
    p:last-of-type { margin-bottom: 0; }
    .contact {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--trait);
    }
    .contact a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      word-break: break-word;
    }
    .contact a:hover { text-decoration: underline; }
    .code {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: .04em;
      color: #9aa3af;
    }
    @media (max-width: 480px) {
      main { padding: 36px 24px; }
      h1 { font-size: 22px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #101418;
        --carte: #171c22;
        --texte: #e8eaed;
        --texte-doux: #a4adb9;
        --trait: #2a313a;
        --accent: #8fb4e8;
      }
      .code { color: #6b7480; }
    }
  </style>
</head>
<body>
  <main>
    <span class="marque">Maintenance technique</span>
    <h1>Impossibilité d'accès</h1>
    <p>Ce site n'est pas accessible pour le moment en raison d'une intervention technique.</p>
    <p>Pour toute question, veuillez contacter le soutien technique.</p>
    <div class="contact">
      <p>Soutien technique — Studio Web Ethos</p>
      <p><a href="mailto:abderraouf@studiowebethos.com">abderraouf@studiowebethos.com</a></p>
    </div>
    <p class="code">Erreur 503 — Service indisponible</p>
  </main>
</body>
</html>
