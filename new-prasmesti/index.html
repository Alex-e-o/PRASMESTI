<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRASMESTI — Portail régional CEEAC de suivi de l'éducation, des sciences, de la technologie et de l'innovation</title>
    <meta name="description" content="PRASMESTI : portail régional de la CEEAC pour le suivi de l'éducation, des sciences, de la technologie et de l'innovation dans les 11 États d'Afrique centrale." />
    <!-- Open Graph / Twitter. Ajouter og:url + canonical + og:image (absolu) une fois le domaine de prod connu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRASMESTI" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="PRASMESTI — Portail régional CEEAC de suivi (Afrique centrale)" />
    <meta property="og:description" content="Suivi régional de l'éducation, des sciences, de la technologie et de l'innovation dans les 11 États membres de la CEEAC." />
    <meta property="og:image" content="/new-prasmesti/assets/prasmesti/shared/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PRASMESTI — Portail régional CEEAC" />
    <meta name="twitter:description" content="Suivi régional de l'éducation, des sciences, de la technologie et de l'innovation en Afrique centrale." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GovernmentOrganization",
        "name": "PRASMESTI",
        "alternateName": "Portail Régional d'Aide au Suivi en matière d'Éducation, Sciences, Technologie et Innovation",
        "description": "Programme régional de la CEEAC pour le suivi de l'éducation, des sciences, de la technologie et de l'innovation dans les États d'Afrique centrale.",
        "parentOrganization": { "@type": "Organization", "name": "CEEAC-ECCAS" },
        "areaServed": "Afrique centrale",
        "logo": "/new-prasmesti/assets/prasmesti/shared/logo.png"
      }
    </script>
    <script>
      // Applique le thème sauvegardé avant l'hydratation pour éviter le flash sombre→clair.
      (function () {
        try {
          var t = localStorage.getItem('new-prasmesti-theme');
          document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
