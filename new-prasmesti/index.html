<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRASMESTI — Portail régional CEEAC de suivi de l'éducation, des sciences, de la technologie et de l'innovation</title>
    <meta name="description" content="PRASMESTI : portail régional de la CEEAC pour le suivi de l'éducation, des sciences, de la technologie et de l'innovation dans les 11 États d'Afrique centrale." />
    <script>
      // Applique le thème sauvegardé avant l'hydratation pour éviter le flash sombre→clair.
      (function () {
        try {
          var t = localStorage.getItem('new-prasmesti-theme');
          document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
